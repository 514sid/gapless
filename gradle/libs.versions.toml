[versions]
agp            = "9.5.1"
kotlin         = "2.4.21"
compileSdk     = "37"
minSdk         = "26"
composeBom     = "2026.09.00"
lifecycle      = "2.11.0"
media3         = "1.11.1"
coil           = "3.6.3"
maven-publish  = "0.37.0"
junit5              = "6.1.3"
androidx-test       = "1.7.0"
androidx-test-ext   = "1.3.0"
mockk               = "1.14.12"
coroutines          = "1.11.0"
androidx-webkit     = "1.18.0"
robolectric         = "4.17"
# The Android runtime Robolectric 4.17 runs SDK 34 tests on. Change it with Robolectric.
robolectric-android-all = "14-robolectric-10818077-i7"
junit4              = "4.13.2"
androidx-test-core  = "1.7.0"

[libraries]
androidx-compose-bom                 = { group = "androidx.compose",           name = "compose-bom",                    version.ref = "composeBom" }
androidx-compose-ui                  = { group = "androidx.compose.ui",        name = "ui"                                                         }
androidx-compose-ui-graphics         = { group = "androidx.compose.ui",        name = "ui-graphics"                                               }
androidx-compose-foundation          = { group = "androidx.compose.foundation", name = "foundation"                                                }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle",          name = "lifecycle-viewmodel-compose",      version.ref = "lifecycle"  }
androidx-media3-exoplayer            = { group = "androidx.media3",              name = "media3-exoplayer",                 version.ref = "media3"     }
androidx-media3-exoplayer-hls        = { group = "androidx.media3",              name = "media3-exoplayer-hls",             version.ref = "media3"     }
androidx-media3-exoplayer-dash       = { group = "androidx.media3",              name = "media3-exoplayer-dash",            version.ref = "media3"     }
androidx-media3-exoplayer-smoothstreaming = { group = "androidx.media3",         name = "media3-exoplayer-smoothstreaming", version.ref = "media3"     }
androidx-media3-exoplayer-rtsp       = { group = "androidx.media3",              name = "media3-exoplayer-rtsp",            version.ref = "media3"     }
androidx-webkit                      = { group = "androidx.webkit",              name = "webkit",                           version.ref = "androidx-webkit" }
coil-compose                         = { group = "io.coil-kt.coil3",            name = "coil-compose",                     version.ref = "coil"       }
coil-network-okhttp                  = { group = "io.coil-kt.coil3",            name = "coil-network-okhttp",              version.ref = "coil"       }
coil-gif                             = { group = "io.coil-kt.coil3",            name = "coil-gif",                         version.ref = "coil"       }
coil-svg                             = { group = "io.coil-kt.coil3",            name = "coil-svg",                         version.ref = "coil"       }
androidx-test-runner                 = { group = "androidx.test",              name = "runner",  version.ref = "androidx-test"     }
androidx-test-ext-junit              = { group = "androidx.test.ext",           name = "junit",   version.ref = "androidx-test-ext" }
junit-bom                            = { group = "org.junit", name = "junit-bom", version.ref = "junit5" }
junit-jupiter                        = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-platform-launcher              = { group = "org.junit.platform", name = "junit-platform-launcher" }
junit4                               = { group = "junit",                      name = "junit",                          version.ref = "junit4" }
junit-vintage-engine                 = { group = "org.junit.vintage", name = "junit-vintage-engine" }
robolectric                          = { group = "org.robolectric",            name = "robolectric",                    version.ref = "robolectric" }
robolectric-android-all              = { group = "org.robolectric",            name = "android-all-instrumented",       version.ref = "robolectric-android-all" }
androidx-test-core                   = { group = "androidx.test",              name = "core",                           version.ref = "androidx-test-core" }
mockk                                = { group = "io.mockk",                    name = "mockk",                          version.ref = "mockk"      }
kotlinx-coroutines-test              = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-test",        version.ref = "coroutines" }
androidx-activity-compose            = { group = "androidx.activity", name = "activity-compose", version = "1.13.0" }
androidx-compose-material3           = { group = "androidx.compose.material3", name = "material3" }

[plugins]
android-library      = { id = "com.android.library",                    version.ref = "agp"    }
android-application  = { id = "com.android.application",                version.ref = "agp"    }
kotlin-android       = { id = "org.jetbrains.kotlin.android",           version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",    version.ref = "kotlin" }
maven-publish        = { id = "com.vanniktech.maven.publish",           version.ref = "maven-publish" }
